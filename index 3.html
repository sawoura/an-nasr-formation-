<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>AN NASR FORMATION</title>
<style>
:root{--bg:#f4f6f5;--c:#fff;--t:#14202b;--m:#5b6b7a;--p:#0b6b3a;--a:#e8a317;--b:#dfe4ea;--ok:#177a3c;--ko:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1519;--c:#182128;--t:#e8eef3;--m:#9aa9b6;--b:#2a3640}}
:root[data-theme=dark]{--bg:#0f1519;--c:#182128;--t:#e8eef3;--m:#9aa9b6;--b:#2a3640}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:var(--p);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 14px}
.logo{font-weight:800;letter-spacing:.5px}.logo b{color:var(--a)}
nav{display:flex;gap:4px;overflow-x:auto;padding:0 10px 8px}
nav a{color:#fff;opacity:.85;padding:6px 10px;border-radius:8px;white-space:nowrap;cursor:pointer;font-size:14px}nav a.on{background:rgba(255,255,255,.2);opacity:1}
main{max-width:860px;margin:0 auto;padding:14px}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:14px;margin:0 0 12px;max-width:100%}
.hero{background:var(--p);color:#fff;border-radius:14px;padding:22px 16px;margin-bottom:12px}.hero h1{margin:0 0 8px;font-size:22px}
.btn{display:inline-block;background:var(--a);color:#14202b;border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;font-size:14px;margin:4px 4px 4px 0}
.btn.s{background:var(--p);color:#fff}.btn.g{background:transparent;border:1px solid var(--b);color:var(--t)}.btn.r{background:var(--ko);color:#fff}.btn.sm{padding:6px 10px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.k{font-size:24px;font-weight:800;color:var(--p)}.m{color:var(--m);font-size:13px}
label{display:block;font-size:13px;color:var(--m);margin:8px 0 3px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--b);border-radius:10px;background:var(--bg);color:var(--t);font:inherit}
.bar{height:10px;background:var(--b);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--p)}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:11px;border:1px solid var(--b);border-radius:10px;background:var(--c);color:var(--t);cursor:pointer;font:inherit}
.opt.sel{border-color:var(--p);background:rgba(11,107,58,.12)}.opt.ok{border-color:var(--ok);background:rgba(23,122,60,.18)}.opt.ko{border-color:var(--ko);background:rgba(192,57,43,.15)}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;background:var(--b)}.tag.ok{background:var(--ok);color:#fff}.tag.w{background:var(--a)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%}td,th{padding:7px;border-bottom:1px solid var(--b);text-align:left;font-size:14px}
#tm{font:700 18px monospace;color:var(--ko)}.msg{padding:10px;border-radius:10px;background:rgba(232,163,23,.2);margin-bottom:10px}
</style></head><body>
<header><div class="top"><div class="logo">AN <b>NASR</b> FORMATION</div><div id="who"></div></div><nav id="nav"></nav></header>
<main id="app"></main>
<script>
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9),F=n=>n.toLocaleString('fr-FR')+' FCFA';
let FM={ess:{n:'Essentielle',p:15000,i:['Cours','QCM']},pre:{n:'Premium',p:30000,i:['Cours','QCM','Examens blancs','Psychotechnique','Anciens sujets']},vip:{n:'VIP',p:60000,i:['Tout Premium','Accompagnement','Suivi personnalisé']}};
let CO={Directs:{A:['Affaires économiques','Administration générale'],B:['Secrétariat','Santé'],C:['Agents administratifs']},Professionnels:{A:['Inspecteurs'],B:['Attachés'],C:['Commis']}};
const q=(s,t,o,r,e)=>({id:uid(),s,q:t,o,r,e,l:'Moyen'});
const seed=()=>({users:[{id:'adm',nom:'Admin',tel:'admin',pw:'admin',role:'admin',st:'actif',ville:'Ouagadougou'}],
qs:[q('Français',"Quel est le pluriel de « cheval » ?",['chevals','chevaux','chevaus','chevales'],1,'Les noms en -al font -aux.'),
q('Français',"« Il faut que tu ... » : choisir la forme correcte.",['viens','viennes','venir','venais'],1,'Après « il faut que », subjonctif.'),
q('Français',"Un synonyme de « rapide » :",['lent','véloce','pâle','dense'],1,'Véloce = rapide.'),
q('Mathématiques','Résoudre x² − 5x + 6 = 0',['x=1 ou 6','x=2 ou 3','x=−2 ou −3','x=0 ou 5'],1,'Somme 5, produit 6 → 2 et 3.'),
q('Mathématiques','15 % de 200 =',['20','25','30','35'],2,'200×0,15 = 30.'),
q('Mathématiques','Racine carrée de 144 :',['10','11','12','14'],2,'12×12=144.'),
q('Droit',"La Constitution est :",['une loi ordinaire','la norme suprême','un décret','un arrêté'],1,'Elle est au sommet de la hiérarchie des normes.'),
q('Droit',"Le pouvoir législatif est exercé par :",['le Parlement','le juge','le préfet','le maire'],0,'Le Parlement vote les lois.'),
q('Culture générale','Capitale du Burkina Faso :',['Bobo-Dioulasso','Koudougou','Ouagadougou','Banfora'],2,'Ouagadougou.'),
q('Culture générale','Monnaie en usage au Burkina Faso :',['Naira','Franc CFA (XOF)','Cedi','Dalasi'],1,'UEMOA : franc CFA.'),
q('Psychotechnique','Suite : 2, 4, 8, 16, ?',['24','30','32','64'],2,'On double chaque fois.'),
q('Psychotechnique','Suite : A, C, E, G, ?',['H','I','J','K'],1,'Une lettre sur deux.')],
subs:[],pays:[],notifs:[],att:[],rev:[],
docs:[{t:'Concours Affaires économiques 2023 — Épreuve de culture générale',y:2023,c:'A'},{t:'Concours Secrétariat 2022 — Français',y:2022,c:'B'},{t:'Concours Commis 2021 — Mathématiques',y:2021,c:'C'}],
arts:[{t:'Ouverture des inscriptions aux concours directs',d:'2026-10-01'},{t:'Conseils pour bien réviser',d:'2026-09-20'}]});
let D;try{D=JSON.parse(localStorage.getItem('nasr'))}catch(e){}D=D||seed();D.fm=D.fm||FM;FM=D.fm;D.co=D.co||CO;CO=D.co;D.cp=D.cp||[{code:'NASR2027',type:'%',val:10,max:100,used:0}];D.cfg=Object.assign({nom:'AN NASR FORMATION',msg:'Préparez votre concours avec AN NASR FORMATION',tel:'',wa:'',email:'',col:'#0b6b3a',exq:0,exd:10,qs:60,pm:{'Orange Money':1,'Moov Money':1,'Paiement manuel':1}},D.cfg);D.mat=D.mat||['Français','Mathématiques','Droit','Culture générale','Psychotechnique'];
const save=()=>{try{localStorage.setItem('nasr',JSON.stringify(D))}catch(e){}};
let S={u:null,v:'home',w:{},z:null,tmp:null,otp:null},T;
const me=()=>D.users.find(u=>u.id===S.u),adm=()=>me()&&me().role==='admin';
function tp(s){if(s.e)return s.e;const[d,m,y]=s.exp.split('/');return new Date(y,m-1,d).getTime()}
const mySubs=()=>D.subs.filter(s=>s.u===S.u&&s.st==='actif'&&tp(s)>Date.now()),lvl=()=>Math.max(0,...mySubs().map(s=>(FM[s.f]||{}).lv||({ess:1,pre:2,vip:3}[s.f]||1)));
const go=(v,x)=>{S.v=v;if(x)Object.assign(S,x);clearInterval(T);render();scrollTo(0,0)};
const notif=(u,m)=>{D.notifs.unshift({u,m,d:new Date().toLocaleDateString('fr-FR'),r:0})};
const fi=(l,x,js,t='text')=>`<label>${l}</label><input type="${t}" value="${String(x).replace(/"/g,'&quot;')}" onchange="${js}">`;
const inp=(id,l,t='text',x='')=>`<label>${l}</label><input id="${id}" type="${t}" value="${String(x).replace(/"/g,'&quot;')}">`,v=id=>$('#'+id).value.trim();
const lock=m=>`<div class="card"><div class="msg">🔒 ${m}</div><button class="btn" onclick="go('shop')">VOIR LES FORMATIONS</button></div>`;
function nav(){let L=[['home','Accueil'],['fm','Formations'],['news','Actualités'],['contact','Contact']];
if(adm())L=[['ad','Tableau de bord'],['ac','Candidats'],['aq','Questions'],['as','Sujets & matières'],['ao','Concours'],['af','Formations & prix'],['asu','Abonnements'],['acp','Coupons'],['ap','Paiements'],['an','Actualités'],['ae','Examens'],['aset','Paramètres']];
else if(me())L=[['dash','Tableau de bord'],['shop','Mes formations'],['qcm','QCM'],['exam','Examens'],['docs','Anciens sujets'],['stats','Résultats'],['rev','À revoir'],['notifs','Notifications'+(D.notifs.filter(n=>n.u===S.u&&!n.r).length?' •':'')]];
$('#nav').innerHTML=L.map(a=>`<a class="${S.v===a[0]?'on':''}" onclick="go('${a[0]}')">${a[1]}</a>`).join('');
$('#who').innerHTML=me()?`<a style="cursor:pointer;font-size:13px" onclick="S.u=null;go('home')">Déconnexion (${me().nom})</a>`:`<button class="btn sm" onclick="go('login')">SE CONNECTER</button><button class="btn sm s" style="border:1px solid #fff" onclick="go('reg')">S'INSCRIRE</button>`}
function applyCfg(){document.documentElement.style.setProperty('--p',D.cfg.col);$('.logo').textContent=D.cfg.nom;document.title=D.cfg.nom}
function render(){applyCfg();nav();$('#app').innerHTML=(V[S.v]||V.home)();if(S.z&&S.v==='quiz')tick()}
const fcards=(b)=>`<div class="grid">${Object.entries(FM).map(([k,f])=>`<div class="card"><b>${f.n}</b><div class="k">${F(f.p)}</div><div class="m">${f.i.join(' · ')}</div>${b?`<button class="btn" onclick="S.w.f='${k}';go('pay')">CHOISIR</button>`:''}</div>`).join('')}</div>`;
const V={
home:()=>`<div class="hero"><h1>${D.cfg.msg.toUpperCase()}</h1><!--Z VOTRE CONCOURS --><p>Cours, QCM, examens blancs, tests psychotechniques, anciens sujets et suivi personnalisé.</p><button class="btn" onclick="go('reg')">COMMENCER MA PRÉPARATION</button><button class="btn g" style="color:#fff" onclick="go('fm')">VOIR LES FORMATIONS</button></div>
<div class="grid">${['Concours directs','Concours professionnels','Catégorie A','Catégorie B','Catégorie C','Tests psychotechniques'].map(x=>`<div class="card"><b>${x}</b></div>`).join('')}</div>
<div class="card"><b>Pourquoi AN NASR ?</b><p>📚 Cours structurés · 📝 QCM nombreux · 🧠 Psychotechniques · ⏱️ Examens chronométrés · 📄 Anciens sujets · 📊 Suivi · 🏆 Classement · 🔔 Actualités</p></div>
<div class="card"><b>Comment ça marche ?</b><p>1. Créer son compte → 2. Choisir son concours → 3. Choisir sa formation → 4. Payer → 5. Accéder aux contenus.</p></div>`,
fm:()=>`<h2>Nos formations & tarifs</h2>${fcards()}<button class="btn s" onclick="go('reg')">S'INSCRIRE</button>`,
news:()=>`<h2>Actualités</h2>${D.arts.map(a=>`<div class="card"><b>${a.t}</b><div class="m">${a.d}</div><p>${a.x||''}</p></div>`).join('')}`,
contact:()=>`<div class="card"><h2>Besoin d'aide ?</h2><p>${D.cfg.tel?'📞 '+D.cfg.tel+'<br>':''}${D.cfg.wa?'WhatsApp : '+D.cfg.wa+'<br>':''}${D.cfg.email?'✉️ '+D.cfg.email:''}</p>${inp('cm','Votre message')}<button class="btn" onclick="alert('Message envoyé (démo).')">ENVOYER</button></div>`,
reg:()=>`<div class="card"><h2>Créer mon compte</h2>${inp('n','Nom')}${inp('p','Prénom')}${inp('t','Téléphone','tel')}${inp('w','WhatsApp','tel')}${inp('e','E-mail','email')}${inp('pw','Mot de passe','password')}${inp('pw2','Confirmation du mot de passe','password')}${inp('vl','Ville')}<label>Sexe (facultatif)</label><select id="sx"><option></option><option>F</option><option>M</option></select><label><input type="checkbox" id="cg" style="width:auto"> J'accepte les conditions générales</label><button class="btn" onclick="reg()">CRÉER MON COMPTE</button></div>`,
otp:()=>`<div class="card"><h2>Vérification du numéro</h2><p>Un code de vérification vous a été envoyé. <span class="m">(Démo : ${S.otp})</span></p>${inp('oc','Code OTP')}<button class="btn" onclick="chk()">VÉRIFIER</button><button class="btn g" onclick="S.otp=String(1000+Math.random()*9000|0);render()">RENVOYER LE CODE</button></div>`,
login:()=>`<div class="card"><h2>Connexion</h2>${inp('li','Téléphone ou e-mail')}${inp('lp','Mot de passe','password')}<button class="btn" onclick="login()">SE CONNECTER</button><button class="btn g" onclick="alert('Parcours OTP → nouveau mot de passe (démo).')">MOT DE PASSE OUBLIÉ ?</button><button class="btn g" onclick="go('reg')">CRÉER UN COMPTE</button></div>`,
dash:()=>{const u=me(),a=D.att.filter(x=>x.u===S.u),n=new Set(a.flatMap(x=>x.a.map(y=>y.id))).size,pr=Math.min(100,Math.round(n/D.qs.length*100)),s=mySubs();
return `<h2>Bonjour ${u.prenom||u.nom}</h2><div class="card"><b>${s.length?s.map(x=>FM[x.f].n+' — '+x.co).join(', '):'Aucune formation active'}</b><div class="m">Progression : ${pr} %</div><div class="bar"><i style="width:${pr}%"></i></div><button class="btn" onclick="go('${s.length?'qcm':'shop'}')">${s.length?'CONTINUER MA FORMATION':'CHOISIR UNE FORMATION'}</button></div>
<div class="grid"><div class="card"><div class="k">${a.length}</div><div class="m">tests réalisés</div></div><div class="card"><div class="k">${a.length?Math.round(a.reduce((x,y)=>x+y.pc,0)/a.length):0} %</div><div class="m">moyenne</div></div></div>${diag()}`},
shop:()=>{const w=S.w;let h='<h2>Choisir ma formation</h2>';
h+=`<div class="card"><label>Type de concours</label><select onchange="S.w={t:this.value};render()"><option></option>${Object.keys(CO).map(k=>`<option ${w.t===k?'selected':''}>${k}</option>`).join('')}</select>`;
if(w.t)h+=`<label>Catégorie</label><select onchange="S.w.c=this.value;S.w.co='';render()"><option></option>${Object.keys(CO[w.t]).map(k=>`<option ${w.c===k?'selected':''}>${k}</option>`).join('')}</select>`;
if(w.c)h+=`<label>Concours</label><select onchange="S.w.co=this.value;render()"><option></option>${CO[w.t][w.c].map(k=>`<option ${w.co===k?'selected':''}>${k}</option>`).join('')}</select>`;
h+='</div>';if(w.co)h+=fcards(1);
return h+`<h3>Mes abonnements</h3>`+(D.subs.filter(s=>s.u===S.u).map(s=>`<div class="card">${FM[s.f].n} — ${s.co} <span class="tag ${s.st==='actif'?'ok':'w'}">${s.st}</span><div class="m">Expire le ${s.exp}</div></div>`).join('')||'<div class="m">Aucun.</div>')},
pay:()=>{const f=FM[S.w.f],e=new Date(Date.now()+(f.j||90)*864e5).toLocaleDateString('fr-FR');return `<div class="card"><h2>Récapitulatif</h2><p>${f.n} — ${S.w.co} (cat. ${S.w.c})<br>Durée : ${f.j||90} jours · Expiration : ${e}<br><b>${F(f.p)}</b></p>${inp('cp','Code promo')}<label>Moyen de paiement</label><select id="pm">${Object.keys(D.cfg.pm).filter(k=>D.cfg.pm[k]).map(k=>`<option>${k}</option>`).join('')}</select>${inp('rf','Référence de transaction (paiement manuel)')}<button class="btn" onclick="pay()">PROCÉDER AU PAIEMENT</button></div>`},
paid:()=>`<div class="card"><h2>${S.tmp.st==='actif'?'✅ Paiement réussi !':'⏳ EN ATTENTE DE VALIDATION'}</h2><p>${S.tmp.st==='actif'?'Votre formation est maintenant activée.':"L'administrateur va vérifier votre paiement."}</p><div class="card">Reçu n° ${S.tmp.id}<br>${me().nom} — ${FM[S.tmp.f].n}<br>${F(S.tmp.amt)} · ${S.tmp.pm} · ${S.tmp.d}</div><button class="btn" onclick="print()">IMPRIMER LE REÇU</button><button class="btn s" onclick="go('dash')">ACCÉDER À MA FORMATION</button></div>`,
qcm:()=>lvl()<1?lock('Abonnez-vous pour accéder aux QCM.'):`<div class="card"><h2>QCM</h2><label>Matière</label><select id="qm"><option value="">Toutes</option>${D.mat.map(m=>`<option>${m}</option>`).join('')}</select><label>Nombre de questions</label><select id="qn"><option>5</option><option>10</option><option>20</option></select><button class="btn" onclick="start(0)">COMMENCER</button></div>`,
exam:()=>lvl()<2?lock('Les examens blancs sont inclus dans Premium et VIP.'):`<div class="card"><h2>EXAMEN BLANC</h2><p>Toutes matières · ordre aléatoire · chronométré · soumission automatique.</p><label>Durée (minutes)</label><input id="ed" type="number" value="${D.cfg.exd}"><button class="btn" onclick="start(1)">COMMENCER L'EXAMEN</button></div>`,
quiz:()=>{const z=S.z,x=z.qs[z.i];return `<div class="card"><div style="display:flex;justify-content:space-between"><b>QUESTION ${z.i+1} / ${z.qs.length}</b><span id="tm"></span></div><div class="bar"><i style="width:${(z.i+1)/z.qs.length*100}%"></i></div><p><b>${x.q}</b></p>${x.o.map((o,j)=>`<button class="opt ${z.a[z.i]===j?'sel':''}" onclick="S.z.a[S.z.i]=${j};render()">${'ABCD'[j]}. ${o}</button>`).join('')}<button class="btn g" ${z.i?'':'disabled'} onclick="S.z.i--;render()">PRÉCÉDENTE</button>${z.i<z.qs.length-1?`<button class="btn s" onclick="S.z.i++;render()">SUIVANTE</button>`:''}<button class="btn" onclick="finish()">TERMINER</button></div>`},
res:()=>{const r=S.tmp;return `<div class="card"><h2>Votre résultat : ${r.ok}/${r.n}</h2><div class="m">Taux de réussite : ${r.pc} % · Temps utilisé : ${r.t}s</div></div>${r.a.map(y=>{const x=D.qs.find(k=>k.id===y.id);return `<div class="card"><b>${x.q}</b><br>${y.g>=0?(y.ok?'✅':'❌ Votre réponse : '+x.o[y.g]):'⚪ Non répondue'}<br>Bonne réponse : ${'ABCD'[x.r]}. ${x.o[x.r]}<div class="m">${x.e}</div>${y.ok?'':`<button class="btn sm g" onclick="addRev('${x.id}',this)">AJOUTER À MES RÉVISIONS</button>`}</div>`}).join('')}`},
stats:()=>{const a=D.att.filter(x=>x.u===S.u);return `<h2>Mes résultats</h2><div class="grid"><div class="card"><div class="k">${a.length}</div><div class="m">tests</div></div><div class="card"><div class="k">${a.length?Math.max(...a.map(x=>x.pc)):0} %</div><div class="m">meilleure note</div></div><div class="card"><div class="k">${a.length?Math.round(a.reduce((s,x)=>s+x.t,0)/a.length):0}s</div><div class="m">temps moyen</div></div></div>${diag()}<div class="card tw"><table><tr><th>Date</th><th>Type</th><th>Score</th></tr>${a.map(x=>`<tr><td>${x.d}</td><td>${x.ex?'Examen':'QCM'}</td><td>${x.ok}/${x.n} (${x.pc} %)</td></tr>`).join('')}</table></div>`},
rev:()=>{const r=D.rev.filter(x=>x.u===S.u);return `<h2>Mes questions difficiles</h2>${r.length?`<button class="btn" onclick="start(2)">REFAIRE CES QUESTIONS</button>`:'<div class="m">Aucune question à revoir.</div>'}${r.map(x=>`<div class="card">${D.qs.find(k=>k.id===x.q).q}</div>`).join('')}`},
docs:()=>lvl()<2?lock('Les anciens sujets sont inclus dans Premium et VIP.'):`<h2>Anciens sujets</h2>${D.docs.map(d=>`<div class="card"><b>${d.t}</b><div class="m">${d.y} · Catégorie ${d.c}</div><button class="btn sm s" onclick="alert('Consultation (démo)')">CONSULTER</button><button class="btn sm g" onclick="alert('Téléchargement journalisé (démo)')">TÉLÉCHARGER</button></div>`).join('')}`,
notifs:()=>{D.notifs.filter(n=>n.u===S.u).forEach(n=>n.r=1);save();return `<h2>Notifications</h2>${D.notifs.filter(n=>n.u===S.u).map(n=>`<div class="card">${n.m}<div class="m">${n.d}</div></div>`).join('')||'<div class="m">Rien pour le moment.</div>'}`},
ad:()=>{const p=D.pays.filter(x=>x.st==='payé');return `<h2>Administration</h2><div class="grid">${[['Candidats',D.users.filter(u=>u.role==='cand').length],['Abonnements actifs',D.subs.filter(s=>s.st==='actif').length],['Chiffre d\'affaires',F(p.reduce((s,x)=>s+x.amt,0))],['Examens réalisés',D.att.length],['Questions',D.qs.length],['Paiements en attente',D.pays.filter(x=>x.st==='attente').length]].map(k=>`<div class="card"><div class="k" style="font-size:19px">${k[1]}</div><div class="m">${k[0]}</div></div>`).join('')}</div>`},
ac:()=>`<h2>Candidats</h2><div class="card tw"><table><tr><th>Nom</th><th>Tél.</th><th>Ville</th><th>Statut</th><th></th></tr>${D.users.filter(u=>u.role==='cand').map(u=>`<tr><td>${u.prenom} ${u.nom}</td><td>${u.tel}</td><td>${u.ville}</td><td>${u.st}</td><td><button class="btn sm g" onclick="tg('${u.id}')">${u.st==='actif'?'Suspendre':'Réactiver'}</button><button class="btn sm g" onclick="ue('${u.id}')">Modifier</button><button class="btn sm r" onclick="ud('${u.id}')">Suppr.</button></td></tr>`).join('')}</table></div>`,
aq:()=>{const e=D.qs.find(x=>x.id===S.eq)||{o:['','','',''],s:'',q:'',e:'',r:0};return `<h2>Banque de questions (${D.qs.length})</h2><div class="card"><b>${S.eq?'MODIFIER LA QUESTION':'+ NOUVELLE QUESTION'}</b><label>Matière</label><select id="am">${D.mat.map(m=>`<option ${m===e.s?'selected':''}>${m}</option>`).join('')}</select>${inp('aqq','Question','text',e.q)}${[0,1,2,3].map(i=>inp('a'+i,'Réponse '+'ABCD'[i],'text',e.o[i])).join('')}<label>Bonne réponse</label><select id="ar">${'ABCD'.split('').map((c,i)=>`<option ${i===e.r?'selected':''}>${c}</option>`).join('')}</select>${inp('ae','Explication','text',e.e)}<button class="btn" onclick="addQ()">ENREGISTRER</button>${S.eq?'<button class="btn g" onclick="S.eq=null;render()">ANNULER</button>':''}</div>
<div class="card"><b>Importation en masse (CSV)</b><div class="m">Question;A;B;C;D;Bonne réponse (A-D);Explication;Matière</div><textarea id="csv" rows="4"></textarea><button class="btn s" onclick="imp()">IMPORTER</button></div>${D.qs.map(x=>`<div class="card"><b>${x.q}</b><div class="m">${x.s}</div><button class="btn sm g" onclick="S.eq='${x.id}';render();scrollTo(0,0)">Modifier</button><button class="btn sm r" onclick="delQ('${x.id}')">Supprimer</button></div>`).join('')}`},
as:()=>{const e=D.docs[S.ed]||{t:'',y:'',c:'A'};return `<h2>Matières</h2><div class="card">${D.mat.map((m,i)=>`<div style="display:flex;gap:6px;align-items:center;margin:4px 0"><span style="flex:1">${m}</span><button class="btn sm g" onclick="rm(${i})">Renommer</button><button class="btn sm r" onclick="dm(${i})">Supprimer</button></div>`).join('')}${inp('nm','Nouvelle matière')}<button class="btn" onclick="am()">AJOUTER</button></div><h2>Anciens sujets</h2>${D.docs.map((d,i)=>`<div class="card"><b>${d.t}</b><div class="m">${d.y} · Catégorie ${d.c}</div><button class="btn sm g" onclick="ed(${i});scrollTo(0,document.body.scrollHeight)">Modifier</button><button class="btn sm r" onclick="dd(${i})">Supprimer</button></div>`).join('')}<div class="card"><b>${S.ed!=null?'Modifier le sujet':'+ NOUVEAU SUJET'}</b>${inp('dt','Intitulé','text',e.t)}${inp('dy','Année','number',e.y)}<label>Catégorie</label><select id="dc">${['A','B','C'].map(c=>`<option ${c===e.c?'selected':''}>${c}</option>`).join('')}</select><button class="btn" onclick="sd()">ENREGISTRER</button>${S.ed!=null?'<button class="btn g" onclick="S.ed=null;render()">ANNULER</button>':''}</div>`},
aset:()=>`<h2>Paramètres</h2><div class="card"><b>Plateforme</b>${fi('Nom de la plateforme',D.cfg.nom,`cs('nom',this.value)`)}${fi('Slogan (bannière)',D.cfg.msg,`cs('msg',this.value)`)}${fi('Téléphone',D.cfg.tel,`cs('tel',this.value)`)}${fi('WhatsApp',D.cfg.wa,`cs('wa',this.value)`)}${fi('E-mail',D.cfg.email,`cs('email',this.value)`)}<label>Couleur principale</label><input type="color" value="${D.cfg.col}" onchange="cs('col',this.value)"></div><div class="card"><b>Moyens de paiement</b>${Object.keys(D.cfg.pm).map(k=>`<label style="color:var(--t)"><input type="checkbox" style="width:auto" ${D.cfg.pm[k]?'checked':''} onchange="D.cfg.pm['${k}']=this.checked?1:0;save()"> ${k}</label>`).join('')}<button class="btn sm g" onclick="pmadd()">+ Ajouter un moyen</button></div><div class="card"><b>Code administrateur</b>${inp('ai','Identifiant','text',me().tel)}${inp('ao','Ancien mot de passe','password')}${inp('an','Nouveau mot de passe','password')}<button class="btn" onclick="setAdm()">CHANGER LE CODE</button></div>`,
af:()=>`<h2>Formations & prix</h2>${Object.entries(FM).map(([k,f])=>`<div class="card"><b>${f.n}</b>${fi('Nom',f.n,`fu('${k}','n',this.value)`)}${fi('Prix (FCFA)',f.p,`fu('${k}','p',this.value)`,'number')}${fi('Durée (jours)',f.j||90,`fu('${k}','j',this.value)`,'number')}${fi('Contenu (séparé par des virgules)',f.i.join(', '),`fu('${k}','i',this.value)`)}<label>Niveau d'accès</label><select onchange="fu('${k}','lv',this.value)">${[[1,'Cours + QCM'],[2,'+ Examens, psychotechnique, anciens sujets'],[3,'VIP']].map(a=>`<option value="${a[0]}" ${(f.lv||{ess:1,pre:2,vip:3}[k]||1)==a[0]?'selected':''}>${a[1]}</option>`).join('')}</select><button class="btn sm r" onclick="fdel('${k}')">Supprimer</button></div>`).join('')}<button class="btn" onclick="fadd()">+ NOUVELLE FORMATION</button>`,
ao:()=>`<h2>Concours</h2>${Object.entries(CO).map(([t,cs])=>`<div class="card"><b>${t}</b> <button class="btn sm r" onclick="cdt('${t}')">Supprimer ce type</button>${Object.entries(cs).map(([c,l])=>`<label>Catégorie ${c} — un concours par ligne</label><textarea rows="3" onchange="cset('${t}','${c}',this.value)">${l.join('\n')}</textarea><button class="btn sm r" onclick="cdc('${t}','${c}')">Supprimer la catégorie ${c}</button>`).join('')}<br><button class="btn sm g" onclick="cac('${t}')">+ Catégorie</button></div>`).join('')}<button class="btn" onclick="cat()">+ NOUVEAU TYPE DE CONCOURS</button>`,
acp:()=>`<h2>Coupons</h2>${D.cp.map((c,i)=>`<div class="card"><b>${c.code}</b> — ${c.type==='%'?c.val+' %':F(c.val)} — ${c.used}/${c.max} utilisations<br><button class="btn sm r" onclick="D.cp.splice(${i},1);save();render()">Supprimer</button></div>`).join('')}<div class="card"><b>+ NOUVEAU COUPON</b>${inp('kc','Code (ex. NASR2027)')}<label>Type</label><select id="kt"><option value="%">Réduction en %</option><option value="F">Réduction fixe (FCFA)</option></select>${inp('kv','Valeur','number')}${inp('km','Nombre d\'utilisations','number')}<button class="btn" onclick="kadd()">CRÉER</button></div>`,
asu:()=>`<h2>Abonnements</h2>${D.subs.map((s,i)=>`<div class="card"><b>${(D.users.find(u=>u.id===s.u)||{nom:'?'}).nom}</b> — ${(FM[s.f]||{n:'?'}).n} — ${s.co}<br><span class="tag ${s.st==='actif'?'ok':'w'}">${s.st}</span> expire le ${new Date(tp(s)).toLocaleDateString('fr-FR')}<br><button class="btn sm s" onclick="sx(${i},'p')">+30 jours</button><button class="btn sm g" onclick="sx(${i},'s')">${s.st==='actif'?'Suspendre':'Activer'}</button><button class="btn sm r" onclick="sx(${i},'a')">Annuler</button></div>`).join('')||'<div class="m">Aucun abonnement.</div>'}<div class="card"><b>+ ACTIVER UNE FORMATION À UN CANDIDAT</b><label>Candidat</label><select id="sc">${D.users.filter(u=>u.role==='cand').map(u=>`<option value="${u.id}">${u.prenom} ${u.nom}</option>`).join('')}</select><label>Formation</label><select id="sf">${Object.entries(FM).map(([k,f])=>`<option value="${k}">${f.n}</option>`).join('')}</select>${inp('sj','Durée (jours)','number',90)}${inp('so','Concours')}<button class="btn" onclick="sadd()">ACTIVER</button></div>`,
an:()=>{const e=D.arts[S.na]||{t:'',x:''};return `<h2>Actualités</h2>${D.arts.map((a,i)=>`<div class="card"><b>${a.t}</b><div class="m">${a.d}</div><button class="btn sm g" onclick="S.na=${i};render();scrollTo(0,document.body.scrollHeight)">Modifier</button><button class="btn sm r" onclick="if(confirm('Supprimer ?')){D.arts.splice(${i},1);S.na=null;save();render()}">Supprimer</button></div>`).join('')}<div class="card"><b>${S.na!=null?'MODIFIER L\'ARTICLE':'NOUVEL ARTICLE'}</b>${inp('nt','Titre','text',e.t)}<label>Contenu</label><textarea id="nx" rows="4">${e.x||''}</textarea><button class="btn" onclick="nsave()">PUBLIER</button>${S.na!=null?'<button class="btn g" onclick="S.na=null;render()">ANNULER</button>':''}</div>`},
ap:()=>`<h2>Paiements</h2>${D.pays.map(x=>`<div class="card">${x.id} — ${(D.users.find(u=>u.id===x.u)||{nom:'(supprimé)'}).nom} — ${F(x.amt)} — ${x.pm}${x.rf?' (réf. '+x.rf+')':''} <span class="tag ${x.st==='payé'?'ok':'w'}">${x.st}</span>${x.st==='attente'?`<br><button class="btn sm s" onclick="vp('${x.id}',1)">VALIDER LE PAIEMENT</button><button class="btn sm r" onclick="vp('${x.id}',0)">REJETER</button>`:''}</div>`).join('')||'<div class="m">Aucun paiement.</div>'}`,
ae:()=>`<h2>Examens & QCM</h2><div class="card">${fi('Questions par examen blanc (0 = toute la banque)',D.cfg.exq,`cs('exq',+this.value)`,'number')}${fi('Durée par défaut d\'un examen (minutes)',D.cfg.exd,`cs('exd',+this.value)`,'number')}${fi('Secondes par question en QCM',D.cfg.qs,`cs('qs',+this.value)`,'number')}</div>`};
function diag(){const a=D.att.filter(x=>x.u===S.u).flatMap(x=>x.a);if(!a.length)return '';const r=D.mat.map(m=>{const t=a.filter(y=>y.s===m);return t.length?[m,Math.round(t.filter(y=>y.ok).length/t.length*100)]:null}).filter(Boolean);const w=r.slice().sort((x,y)=>x[1]-y[1])[0];
return `<div class="card"><b>Diagnostic de niveau</b>${r.map(x=>`<div class="m">${x[0]} — ${x[1]} %</div><div class="bar"><i style="width:${x[1]}%"></i></div>`).join('')}<div class="msg" style="margin-top:10px">⚠️ Priorité : ${w[0]} — refaites des QCM ciblés et un examen blanc.</div></div>`}
function reg(){const f=['n','p','t','w','e','pw','vl'].map(v),[n,p,t,w,e,pw,vl]=f;if(!n||!p||!t||!pw||!e)return alert('Remplissez les champs obligatoires.');if(pw!==v('pw2'))return alert('Les mots de passe ne correspondent pas.');if(!$('#cg').checked)return alert('Acceptez les conditions.');if(D.users.some(u=>u.tel===t||u.email===e))return alert('Compte déjà existant.');
S.tmp={id:uid(),nom:n,prenom:p,tel:t,wa:w,email:e,pw,ville:vl,role:'cand',st:'en attente'};S.otp=String(1000+Math.random()*9000|0);go('otp')}
function chk(){if(v('oc')!==S.otp)return alert('Code incorrect.');S.tmp.st='actif';D.users.push(S.tmp);S.u=S.tmp.id;notif(S.u,'Bienvenue sur AN NASR FORMATION !');save();go('shop')}
function login(){const i=v('li'),u=D.users.find(x=>(x.tel===i||x.email===i)&&x.pw===v('lp'));if(!u)return alert('Identifiants incorrects.');if(u.st==='suspendu')return alert('Compte suspendu.');S.u=u.id;go(u.role==='admin'?'ad':'dash')}
function pay(){let f=FM[S.w.f],amt=f.p,cp=D.cp.find(c=>c.code===v('cp').toUpperCase()&&c.used<c.max);if(v('cp')&&!cp)return alert('Code promo invalide.');if(cp){amt=Math.max(0,cp.type==='%'?Math.round(amt*(1-cp.val/100)):amt-cp.val);cp.used++}const pm=$('#pm').value,man=pm==='Paiement manuel';if(man&&!v('rf'))return alert('Indiquez la référence de transaction.');
const p={id:'TR'+uid().toUpperCase(),u:S.u,f:S.w.f,co:S.w.co,amt,pm,rf:v('rf'),st:man?'attente':'payé',d:new Date().toLocaleDateString('fr-FR')};D.pays.push(p);
if(!man)act(p);else notif(S.u,'Paiement en attente de validation.');save();go('paid',{tmp:{...p,st:man?'attente':'actif'}})}
function act(p){const e=Date.now()+(FM[p.f].j||90)*864e5;D.subs.push({u:p.u,f:p.f,co:p.co,st:'actif',e,exp:new Date(e).toLocaleDateString('fr-FR')});notif(p.u,'✅ Paiement réussi : formation activée.')}
function vp(id,ok){const p=D.pays.find(x=>x.id===id);p.st=ok?'payé':'rejeté';if(ok)act(p);else notif(p.u,'Paiement rejeté.');save();render()}
function tg(id){const u=D.users.find(x=>x.id===id);u.st=u.st==='actif'?'suspendu':'actif';save();render()}
function addQ(){if(!v('aqq'))return;const o={s:$('#am').value,q:v('aqq'),o:[v('a0'),v('a1'),v('a2'),v('a3')],r:'ABCD'.indexOf($('#ar').value),e:v('ae')};if(S.eq)Object.assign(D.qs.find(x=>x.id===S.eq),o);else D.qs.push({id:uid(),l:'Moyen',...o});S.eq=null;save();go('aq')}
function delQ(id){if(confirm('Supprimer cette question ?')){D.qs=D.qs.filter(x=>x.id!==id);save();render()}}
function setAdm(){const u=me();if(v('ao')!==u.pw)return alert('Ancien mot de passe incorrect.');if(v('an').length<4)return alert('Minimum 4 caractères.');u.pw=v('an');if(v('ai'))u.tel=v('ai');save();alert('Code administrateur mis à jour.')}
function am(){const n=v('nm');if(!n||D.mat.includes(n))return;D.mat.push(n);save();render()}
function rm(i){const n=(prompt('Nouveau nom',D.mat[i])||'').trim();if(!n)return;D.qs.forEach(q=>{if(q.s===D.mat[i])q.s=n});D.mat[i]=n;save();render()}
function dm(i){if(confirm('Supprimer cette matière ?')){D.mat.splice(i,1);save();render()}}
function ed(i){S.ed=i;render()}
function dd(i){if(confirm('Supprimer ce sujet ?')){D.docs.splice(i,1);S.ed=null;save();render()}}
function sd(){const d={t:v('dt'),y:+v('dy')||2026,c:$('#dc').value};if(!d.t)return;if(S.ed!=null)D.docs[S.ed]=d;else D.docs.push(d);S.ed=null;save();render()}
function imp(){let n=0;v('csv').split('\n').forEach(l=>{const c=l.split(';').map(x=>x.trim());if(c.length>=8&&'ABCD'.includes(c[5])){D.qs.push({id:uid(),s:c[7],q:c[0],o:c.slice(1,5),r:'ABCD'.indexOf(c[5]),e:c[6],l:'Moyen'});n++}});save();alert(n+' question(s) importée(s).');go('aq')}
function start(m){let qs=D.qs.slice();if(m===2)qs=D.rev.filter(x=>x.u===S.u).map(x=>D.qs.find(k=>k.id===x.q));else if(m===0){const s=$('#qm').value;if(s)qs=qs.filter(x=>x.s===s)}
qs.sort(()=>Math.random()-.5);if(m!==1&&m!==2)qs=qs.slice(0,+$('#qn').value);if(m===1&&D.cfg.exq>0)qs=qs.slice(0,D.cfg.exq);if(!qs.length)return alert('Aucune question.');
const dur=m===1?(+$('#ed').value||D.cfg.exd)*60:qs.length*(D.cfg.qs||60);S.z={qs,i:0,a:[],end:Date.now()+dur*1e3,st:Date.now(),ex:m===1};go('quiz')}
function tick(){const f=()=>{const s=Math.max(0,Math.round((S.z.end-Date.now())/1e3)),e=$('#tm');if(e)e.textContent=String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0');if(!s){clearInterval(T);alert('Temps écoulé. La copie est soumise automatiquement.');finish()}};f();T=setInterval(f,1000)}
function finish(){clearInterval(T);const z=S.z,a=z.qs.map((x,i)=>({id:x.id,s:x.s,g:z.a[i]===undefined?-1:z.a[i],ok:z.a[i]===x.r})),ok=a.filter(y=>y.ok).length,r={u:S.u,a,ok,n:a.length,pc:Math.round(ok/a.length*100),t:Math.round((Date.now()-z.st)/1e3),ex:z.ex,d:new Date().toLocaleDateString('fr-FR')};D.att.push(r);D.rev=D.rev.filter(x=>!(x.u===S.u&&a.some(y=>y.ok&&y.id===x.q)));S.z=null;notif(S.u,'Résultat : '+ok+'/'+a.length);save();go('res',{tmp:r})}
function addRev(id,b){if(!D.rev.some(x=>x.u===S.u&&x.q===id))D.rev.push({u:S.u,q:id});save();b.textContent='✔ AJOUTÉE'}
function cs(k,x){D.cfg[k]=x;save();applyCfg()}
function pmadd(){const n=(prompt('Nom du moyen de paiement')||'').trim();if(n&&!(n in D.cfg.pm)){D.cfg.pm[n]=1;save();render()}}
function fu(k,f,x){FM[k][f]=['p','j','lv'].includes(f)?+x:f==='i'?x.split(',').map(a=>a.trim()).filter(Boolean):x;save()}
function fadd(){FM['f'+uid()]={n:'Nouvelle formation',p:10000,j:90,lv:1,i:['Cours','QCM']};save();render()}
function fdel(k){if(D.subs.some(s=>s.f===k)||D.pays.some(p=>p.f===k))return alert('Formation déjà achetée : modifiez-la plutôt.');if(confirm('Supprimer cette formation ?')){delete FM[k];save();render()}}
function cset(t,c,x){CO[t][c]=x.split('\n').map(a=>a.trim()).filter(Boolean);save()}
function cdc(t,c){if(confirm('Supprimer ?')){delete CO[t][c];save();render()}}
function cdt(t){if(confirm('Supprimer ce type et ses catégories ?')){delete CO[t];save();render()}}
function cac(t){const c=(prompt('Nom de la catégorie (ex. D)')||'').trim();if(c&&!CO[t][c]){CO[t][c]=[];save();render()}}
function cat(){const t=(prompt('Nom du type de concours')||'').trim();if(t&&!CO[t]){CO[t]={};save();render()}}
function kadd(){const c=v('kc').toUpperCase();if(!c||!+v('kv'))return;D.cp.push({code:c,type:$('#kt').value,val:+v('kv'),max:+v('km')||9999,used:0});save();render()}
function sx(i,a){const s=D.subs[i];if(a==='p'){s.e=tp(s)+30*864e5;s.exp=new Date(s.e).toLocaleDateString('fr-FR')}else if(a==='s')s.st=s.st==='actif'?'suspendu':'actif';else if(confirm('Annuler cet abonnement ?'))s.st='annulé';save();render()}
function sadd(){const u=$('#sc').value;if(!u)return;const e=Date.now()+(+v('sj')||90)*864e5;D.subs.push({u,f:$('#sf').value,co:v('so')||'—',st:'actif',e,exp:new Date(e).toLocaleDateString('fr-FR')});notif(u,'Une formation a été activée sur votre compte.');save();render()}
function nsave(){const t=v('nt');if(!t)return;const o={t,x:$('#nx').value,d:new Date().toISOString().slice(0,10)};if(S.na!=null)D.arts[S.na]=o;else D.arts.unshift(o);S.na=null;save();render()}
function ue(id){const u=D.users.find(x=>x.id===id),f=(l,k)=>{const r=prompt(l,u[k]||'');if(r!==null)u[k]=r.trim()};f('Nom','nom');f('Prénom','prenom');f('Téléphone','tel');f('Ville','ville');f('Mot de passe','pw');save();render()}
function ud(id){if(confirm('Supprimer ce candidat et ses données ?')){D.users=D.users.filter(u=>u.id!==id);D.subs=D.subs.filter(s=>s.u!==id);D.att=D.att.filter(a=>a.u!==id);save();render()}}
render();
</script></body></html>
